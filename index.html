<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>أنشطة جلسة التصيّد الإلكتروني</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: projector-first. A home grid of the session's activities in order; each opens full-screen. Deliberately one dark look matching the deck's navy. */
:root{
  --bg:#0A1233; --bg2:#18225C; --ink:#F2F6FF; --muted:#A9B5D6; --line:rgba(255,255,255,.14); --tile:rgba(255,255,255,.05);
  --teal:#2AD4C8; --on-teal:#04211F; --red:#FF6B57; --green:#4CD89B; --amber:#FFD27A;
  --paper:#FFFFFF; --paper-ink:#1A2340; --paper-muted:#66708A;
  --k1:#E21B3C; --k2:#1368CE; --k3:#C98B00; --k4:#26890C;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(110% 80% at 90% 0%,var(--bg2),var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;min-height:100vh}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* home */
.home{padding-block:44px 56px;display:grid;gap:30px}
.brand{color:var(--teal);font-weight:600;font-size:.95rem}
.home h1{font-size:clamp(1.9rem,4.6vw,3.1rem)}
.home .lead{color:var(--muted);margin:0;font-size:1.1rem;max-width:60ch}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-align:start;cursor:pointer;display:grid;gap:6px;align-content:start;transition:background .2s,border-color .2s,transform .2s}
.tile:hover{background:rgba(255,255,255,.09);border-color:var(--teal);transform:translateY(-2px)}
.tile .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .num{font-family:var(--f-mono);font-weight:600;color:var(--on-teal);background:var(--teal);border-radius:8px;padding:0 9px;font-size:.95rem}
.tile .sl{color:var(--muted);font-size:.82rem}
.tile h2{font-size:1.3rem}
.tile p{margin:0;color:var(--muted);font-size:.95rem}
.foot{color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}

/* stage */
.stage{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 85% 0%,var(--bg2),var(--bg) 60%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.st-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.st-top h2{font-size:1.1rem;font-weight:600;flex:1;min-width:0}
.st-top .num{font-family:var(--f-mono);font-weight:600;color:var(--on-teal);background:var(--teal);border-radius:8px;padding:0 9px}
.sbtn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:.95rem}
.sbtn:hover{background:rgba(255,255,255,.16)}
.sbtn.go{background:var(--teal);color:var(--on-teal);border-color:var(--teal);font-weight:700}
.sbtn.red{background:var(--red);border-color:var(--red);color:#2A0700;font-weight:700}
.sbtn.green{background:var(--green);border-color:var(--green);color:#03250F;font-weight:700}
.sbtn[disabled]{opacity:.35;cursor:default}
.st-body{flex:1;overflow:auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.st-in{max-width:980px;margin:0 auto;display:grid;gap:22px}
.st-q{font-family:var(--f-display);font-size:clamp(1.5rem,3.6vw,2.6rem);line-height:1.4;text-wrap:balance;font-weight:600}
.st-sub{color:var(--muted);font-size:1.1rem}
.st-nav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.counter{font-family:var(--f-mono);color:var(--muted)}

.poll-opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px 16px;position:relative;overflow:hidden}
.poll-opt .fill{position:absolute;inset-block:0;right:0;background:rgba(42,212,200,.22);transition:width .3s}
.poll-opt > *{position:relative}
.poll-opt .t{font-size:1.3rem;font-weight:500}
.tally{display:flex;align-items:center;gap:8px}
.tally .n{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;min-width:2.2ch;text-align:center}

.mock-wrap{display:flex;justify-content:center}
.mock{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:18px 20px;width:min(640px,100%);box-shadow:0 30px 60px -30px rgba(0,0,0,.7);font-size:1.15rem;line-height:1.85;position:relative}
.mock .ex{position:absolute;top:-11px;left:16px;background:var(--amber);color:#3A2600;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 10px}
.mock .hd{display:flex;gap:10px;align-items:center;border-bottom:1px solid #E3E7EF;padding-bottom:10px;margin-bottom:12px}
.mock .av{width:40px;height:40px;border-radius:50%;background:#D7DDEA;display:grid;place-items:center;font-weight:700;color:#3A4566;flex:none}
.mock .from{font-weight:700}
.mock .addr{color:var(--paper-muted);font-size:.9rem;direction:ltr;unicode-bidi:isolate;word-break:break-all}
.mock .subj{font-weight:700;margin-bottom:6px}
.mock .linkbtn{display:inline-block;background:#1D63D8;color:#fff;border-radius:8px;padding:6px 16px;margin-top:8px;font-weight:600}
.mock .url{color:#1D63D8;text-decoration:underline;direction:ltr;unicode-bidi:isolate;word-break:break-all}
.bubble{background:#EEF1F6;border-radius:16px 16px 4px 16px;padding:12px 16px}
.mock.call{background:linear-gradient(#1F2A4A,#0F1630);color:#fff;text-align:center}
.mock.call .who{font-size:1.4rem;font-weight:700}
.mock.call .num{color:#B5C0DD;direction:ltr;unicode-bidi:isolate}
.mock.call .line{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;margin-top:14px;text-align:start}
.mock.qr{text-align:center;background:#FFF6D6}
.mock.qr canvas{width:150px;height:150px;image-rendering:pixelated;margin:10px auto;display:block;border:8px solid #fff;border-radius:6px}
.mock .acts{display:flex;gap:18px;color:#8A93A8;font-size:.85rem;border-top:1px solid #E3E7EF;margin-top:12px;padding-top:8px}
.mock.scene{background:#F4F1FA}
.mock.scene .bubble{background:#fff;margin-top:8px}
mark{background:transparent;color:inherit;border-radius:4px;transition:background .3s,box-shadow .3s}
.revealed mark.f{background:rgba(255,107,87,.28);box-shadow:0 0 0 2px var(--red)}
.revealed mark.g{background:rgba(76,216,155,.28);box-shadow:0 0 0 2px var(--green)}
.revealed mark::after{content:attr(data-n);font-family:var(--f-mono);font-size:.7rem;font-weight:700;background:var(--red);color:#fff;border-radius:999px;padding:0 6px;margin-inline-start:4px;vertical-align:super}
.revealed mark.g::after{background:var(--green);color:#03250F}
.vote{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.vote .sbtn{font-size:1.3rem;padding:12px 36px}
.verdict{border-radius:14px;padding:16px 20px;border:1px solid var(--line);background:var(--tile)}
.verdict h3{font-size:1.5rem;margin-bottom:6px}
.verdict.p h3{color:var(--red)} .verdict.l h3{color:var(--green)}
.verdict ol{margin:6px 0 0;padding-inline-start:22px;display:grid;gap:4px;font-size:1.1rem}
.verdict .room{color:var(--muted);font-size:.95rem;margin-top:8px}
.score{font-family:var(--f-mono);color:var(--teal)}

.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qopt{border-radius:12px;padding:18px;color:#fff;font-size:1.25rem;font-weight:600;display:flex;gap:12px;align-items:center;min-height:86px;transition:opacity .3s,transform .3s}
.qopt .sh{font-size:1.3rem;flex:none;width:1.6em;text-align:center}
.qopt:nth-child(1){background:var(--k1)} .qopt:nth-child(2){background:var(--k2)} .qopt:nth-child(3){background:var(--k3)} .qopt:nth-child(4){background:var(--k4)}
.revealed .qopt{opacity:.28}
.revealed .qopt.right{opacity:1;transform:scale(1.02);box-shadow:0 0 0 4px #fff}
.explain{background:rgba(255,255,255,.06);border-radius:12px;padding:12px 16px;font-size:1.1rem}
@media (max-width:640px){.qopts{grid-template-columns:1fr}}

.lesson{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.box h3{font-size:1.15rem;margin-bottom:6px;color:var(--teal)}
.box ul{margin:0;padding-inline-start:20px;font-size:1.12rem}
@media (max-width:640px){.lesson{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs .sbtn[aria-selected="true"]{background:var(--teal);color:var(--on-teal);border-color:var(--teal);font-weight:700}
.statusbar{background:#E9ECF2;color:#333;font-family:var(--f-mono);font-size:.85rem;padding:4px 10px;border-radius:0 0 10px 10px;margin:14px -20px -18px;direction:ltr;text-align:left;min-height:1.9em;word-break:break-all}
.fakelink{background:none;border:0;padding:0;color:#1D63D8;text-decoration:underline;cursor:pointer;font-weight:600;font-size:inherit}
.domains{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;text-align:start;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer}
.dom .u{font-family:var(--f-mono);font-size:1.15rem;direction:ltr;unicode-bidi:isolate;text-align:left;word-break:break-all;grid-column:2}
.dom .ic{grid-row:1/span 2;font-size:1.5rem;width:1.4em;text-align:center}
.dom .why{grid-column:2;color:var(--muted);font-size:1rem;display:none}
.dom.shown .why{display:block}
.dom.shown.ok{border-color:var(--green)} .dom.shown.bad{border-color:var(--red)}
.dom.shown.ok .ic{color:var(--green)} .dom.shown.bad .ic{color:var(--red)}
.rsteps{display:grid;gap:12px;counter-reset:r;margin:0;padding:0;list-style:none}
.rsteps li{counter-increment:r;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--tile);border-radius:14px;padding:14px 18px;font-size:1.2rem}
.rsteps li::before{content:counter(r);font-family:var(--f-mono);font-weight:600;background:var(--teal);color:var(--on-teal);border-radius:50%;width:1.9em;height:1.9em;display:grid;place-items:center;font-size:1rem}
.channels{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--tile);border:1px solid var(--teal);border-radius:16px;padding:18px 22px}
.channels .lbl{color:var(--muted);font-size:.95rem}
.channels .val{font-size:1.5rem;font-weight:600}
.channels a{color:var(--teal)}
.qrbox{background:#fff;border-radius:12px;padding:8px;width:170px;height:170px;display:grid;place-items:center}
.qrbox img{display:block}
@media (max-width:640px){.channels{grid-template-columns:1fr}.qrbox{justify-self:center}}
.big-link{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:var(--on-teal);font-weight:700;text-decoration:none;padding:12px 24px;border-radius:12px;font-size:1.1rem}
.disc{display:grid;gap:10px;margin:0;padding-inline-start:22px;font-size:1.25rem}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.rule{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:4px}
.rule b{font-family:var(--f-display);font-size:1.2rem;color:var(--teal)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div dir="rtl" lang="ar">
  <main class="wrap home" id="home">
    <div class="brand">جامعة الطائف · إدارة الأمن السيبراني</div>
    <div style="display:grid;gap:10px">
      <h1>التصيّد الإلكتروني: خطر متجدّد.. وتهديد مستمر</h1>
      <p class="lead">أنشطة الجلسة التوعوية. شارك برأيك في كل نشاط، واكتشف بنفسك كيف تُصنع رسائل التصيّد وكيف تكشفها.</p>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="foot"><span>للإبلاغ عن أي محاولة تصيّد: <b class="ltr">ir@tu.edu.sa</b></span><span>اضغط على أي نشاط لعرضه بملء الشاشة</span></div>
  </main>
</div>

<div class="stage" id="stage" hidden dir="rtl" lang="ar" role="dialog" aria-modal="true" aria-labelledby="stTitle">
  <div class="st-top">
    <span class="num" id="stNum"></span>
    <h2 id="stTitle"></h2>
    <button class="sbtn" id="stFull" type="button">ملء الشاشة</button>
    <button class="sbtn" id="stHome" type="button">كل الأنشطة</button>
    <button class="sbtn go" id="stNext" type="button">النشاط التالي ←</button>
  </div>
  <div class="st-body"><div class="st-in" id="stBody"></div></div>
</div>

<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D='tu.edu.sa',B='tu';
const REPORT_EMAIL='ir@tu.edu.sa';
const REPORT_FORM='https://forms.microsoft.com/r/prijvFCTuw';
const REPORT_PAGE='https://www.tu.edu.sa/Ar/Cybersecurity-Administration/334/Pages/23313/Report-a-Cyber-Incident';

const ACTS=[
 {id:'call',name:'مكالمة من «الموارد البشرية»',desc:'خبر سعيد عن مكافأة… ماذا لاحظت في المكالمة؟',slide:6,fn:()=>toolCall()},
 {id:'social',name:'احتيال عبر التواصل الاجتماعي والمباشر',desc:'4 أمثلة من المنصات و4 مواقف وجهاً لوجه. هل تكشفها؟',slide:6,fn:()=>toolChannels()},
 {id:'game',name:'تصيّد أم سليمة؟',desc:'8 رسائل حقيقية الشكل. هل تكشف المزيّف منها؟',slide:7,fn:()=>toolGame()},
 {id:'links',name:'افحص الرابط قبل أن تضغط',desc:'العنوان الظاهر والعنوان الحقيقي، واكتشف النطاق السليم.',slide:9,fn:()=>toolDemo()},
 {id:'report',name:'كيف تُبلغ؟',desc:'البريد الإلكتروني أو نموذج الإبلاغ عبر رمز QR.',slide:11,fn:()=>toolReport()},
 {id:'quiz',name:'المسابقة',desc:'7 أسئلة سريعة. من يجيب أسرع؟',slide:12,fn:()=>toolQuiz()},
 {id:'recap',name:'خمس قواعد تحميك',desc:'خلاصة الجلسة في شاشة واحدة.',slide:13,fn:()=>toolRecap()}
];

$('#tiles').innerHTML=ACTS.map((a,i)=>`<button class="tile" type="button" data-a="${i}"><span class="top"><span class="num">${i+1}</span><span class="sl">الشريحة ${a.slide}</span></span><h2>${esc(a.name)}</h2><p>${esc(a.desc)}</p></button>`).join('');
$('#tiles').onclick=e=>{const t=e.target.closest('[data-a]');if(t)open(+t.dataset.a)};

const stage=$('#stage'),stBody=$('#stBody');let curA=-1,stKeys=null;
function open(i){
  curA=i;const a=ACTS[i];stKeys=null;
  $('#stNum').textContent=i+1;$('#stTitle').textContent=a.name;
  $('#stNext').hidden=i>=ACTS.length-1;
  stage.hidden=false;document.body.style.overflow='hidden';stBody.parentElement.scrollTop=0;
  a.fn();
  try{history.replaceState(null,'','#'+a.id)}catch(e){}
}
function home(){stage.hidden=true;document.body.style.overflow='';curA=-1;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
$('#stHome').onclick=home;
$('#stNext').onclick=()=>{if(curA<ACTS.length-1)open(curA+1)};
$('#stFull').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
document.addEventListener('keydown',e=>{
  if(stage.hidden)return;
  if(e.key==='Escape'&&!document.fullscreenElement){home();return}
  if(stKeys&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();stKeys(e.key==='ArrowLeft'?1:-1)}
});

/* poll */
const POLL=[
 {q:'خلال الشهر الماضي، هل وصلتك رسالة أو مكالمة مشبوهة؟',o:['نعم، أكثر من مرة','نعم، مرة واحدة','لا أتذكر','لا']},
 {q:'هل سبق أن ضغطت على رابط ثم شككت فيه بعدها؟',o:['نعم','لا','لست متأكداً']}
];
let pollIdx=0,pollCounts=POLL.map(p=>p.o.map(()=>0));
function toolPoll(){
  const p=POLL[pollIdx],c=pollCounts[pollIdx],mx=Math.max(1,...c);
  stBody.innerHTML=`<div class="counter">سؤال ${pollIdx+1} من ${POLL.length} · ارفع يدك</div>
   <div class="st-q">${esc(p.q)}</div>
   <div style="display:grid;gap:10px">${p.o.map((o,i)=>`<div class="poll-opt"><span class="fill" style="width:${c[i]/mx*100}%"></span><span class="t">${esc(o)}</span>
     <span class="tally"><button class="sbtn" type="button" data-p="${i}" data-d="-1" aria-label="إنقاص">−</button><span class="n">${c[i]}</span><button class="sbtn go" type="button" data-p="${i}" data-d="1" aria-label="زيادة">+</button></span></div>`).join('')}</div>
   <div class="st-nav"><button class="sbtn" type="button" id="pp" ${pollIdx?'':'disabled'}>→ السؤال السابق</button><button class="sbtn" type="button" id="pn" ${pollIdx<POLL.length-1?'':'disabled'}>السؤال التالي ←</button></div>`;
  stBody.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=+b.dataset.p;c[i]=Math.max(0,c[i]+ +b.dataset.d);toolPoll()});
  const nav=d=>{const n=pollIdx+d;if(n>=0&&n<POLL.length){pollIdx=n;toolPoll()}};
  $('#pp').onclick=()=>nav(-1);$('#pn').onclick=()=>nav(1);stKeys=nav;
}

/* video */
function toolVideo(n){
  const v=n===1?{url:'https://www.youtube.com/watch?v=RVuIIkgYeKY',before:'انتبه للحظة التي بدأ فيها الخطأ.',after:['ما أول علامة كان يجب أن تثير الشك؟','ماذا كان يمكن أن يفعل بشكل مختلف؟','هل مرّ عليك موقف مشابه؟']}

function qrCanvas(c){
  const n=25,s=6,x=c.getContext('2d');c.width=c.height=n*s;x.fillStyle='#fff';x.fillRect(0,0,n*s,n*s);x.fillStyle='#111';
  let r=7;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(rnd()>.55)x.fillRect(i*s,j*s,s,s);
  for(const [a,b] of [[0,0],[n-7,0],[0,n-7]]){x.fillStyle='#fff';x.fillRect((a-1)*s,(b-1)*s,9*s,9*s);x.fillStyle='#111';x.fillRect(a*s,b*s,7*s,7*s);x.fillStyle='#fff';x.fillRect((a+1)*s,(b+1)*s,5*s,5*s);x.fillStyle='#111';x.fillRect((a+2)*s,(b+2)*s,3*s,3*s)}
}

function playSet(S,items,O){
  const again=()=>playSet(S,items,O);
  if(S.i>=items.length){
    const right=items.filter((m,i)=>S.v[i]!=null&&S.v[i]===m.p).length,voted=Object.keys(S.v).length;
    stBody.innerHTML=`<div class="counter">النتيجة</div><div class="st-q">أصابت القاعة في ${right} من ${voted} ${O.unitP}</div>
     <div class="st-sub">${items.filter(m=>m.p).length} من ${items.length} ${O.unitP} كانت تصيّداً. ${O.endNote}</div>
     <div class="st-nav"><button class="sbtn" type="button" id="gb">→ رجوع</button><button class="sbtn go" type="button" id="gr">↺ إعادة اللعبة</button></div>`;
    $('#gb').onclick=()=>{S.i=items.length-1;again()};$('#gr').onclick=()=>{S.i=0;S.v={};again()};
    stKeys=d=>{if(d<0){S.i=items.length-1;again()}};return;
  }
  const m=items[S.i],v=S.v[S.i],shown=v!=null;
  const right=items.filter((x,i)=>S.v[i]!=null&&S.v[i]===x.p).length;
  stBody.innerHTML=`<div class="st-nav"><span class="counter">${O.unit} ${S.i+1} من ${items.length} · ${esc(m.ch)}</span><span class="score">نتيجة القاعة: ${right} / ${Object.keys(S.v).length}</span></div>
   <div class="mock-wrap ${shown?'revealed':''}">${mockHTML(m)}</div>
   ${shown?`<div class="verdict ${m.p?'p':'l'}"><h3>${m.p?'تصيّد ✕':O.ok}</h3>
      <ol>${m.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ol>
      <div class="room">رأي القاعة: ${v?'تصيّد':'سليمة'} · ${v===m.p?'إجابة صحيحة 👏':'إجابة غير صحيحة'}</div></div>`
   :`<div class="st-sub" style="text-align:center">ارفعوا أيديكم: تصيّد أم سليمة؟</div>
     <div class="vote"><button class="sbtn red" type="button" data-v="1">تصيّد</button><button class="sbtn green" type="button" data-v="0">سليمة</button></div>`}
   <div class="st-nav"><button class="sbtn" type="button" id="gp" ${S.i?'':'disabled'}>→ السابقة</button>
     ${shown?`<button class="sbtn" type="button" id="gu">إخفاء الجواب</button>`:''}
     <button class="sbtn ${shown?'go':''}" type="button" id="gn">${S.i===items.length-1?'النتيجة ←':'التالية ←'}</button></div>`;
  const cv=stBody.querySelector('canvas');if(cv)qrCanvas(cv);
  stBody.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.v[S.i]=b.dataset.v==='1';again()});
  const nav=d=>{S.i=Math.max(0,S.i+d);again()};
  $('#gp').onclick=()=>nav(-1);$('#gn').onclick=()=>nav(1);if($('#gu'))$('#gu').onclick=()=>{delete S.v[S.i];again()};
  stKeys=nav;
}

     <div class="domains">${list.map((x,i)=>`<button type="button" class="dom ${x.ok?'ok':'bad'}" data-k="${i}"><span class="ic">؟</span><span class="u">${esc(x.u)}</span><span class="why">${esc(x.w)}</span></button>`).join('')}</div>

    stBody.querySelectorAll('.dom').forEach(b=>b.onclick=()=>rev(b));$('#dAll').onclick=()=>stBody.querySelectorAll('.dom').forEach(rev);

  stBody.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{demoTab=+b.dataset.t;toolDemo()});

];
let qIdx=0,qShown=false;const SH=['▲','◆','●','■'];
function toolQuiz(){
  if(qIdx>=QUIZ.length){
    stBody.innerHTML=`<div class="st-q">انتهت المسابقة 🎉</div><div class="st-sub">شكراً لمشاركتكم. ننتقل الآن إلى أسئلتكم واستفساراتكم.</div>
     <div class="st-nav"><button class="sbtn" type="button" id="qb">→ رجوع</button><button class="sbtn go" type="button" id="qr">↺ من البداية</button></div>`;
    $('#qb').onclick=()=>{qIdx=QUIZ.length-1;qShown=true;toolQuiz()};$('#qr').onclick=()=>{qIdx=0;qShown=false;toolQuiz()};
    stKeys=d=>{if(d<0){qIdx=QUIZ.length-1;qShown=true;toolQuiz()}};return;
  }
  const q=QUIZ[qIdx];
  stBody.innerHTML=`<span class="counter">سؤال ${qIdx+1} من ${QUIZ.length}</span>
   <div class="st-q">${esc(q.q)}</div>
   <div class="qopts ${qShown?'revealed':''}">${q.o.map((o,i)=>`<div class="qopt ${i===q.a?'right':''}"><span class="sh">${SH[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>
   ${qShown?`<div class="explain">${esc(q.e)}</div>`:''}
   <div class="st-nav"><button class="sbtn" type="button" id="qp" ${qIdx?'':'disabled'}>→ السابق</button>
     ${qShown?'':`<button class="sbtn go" type="button" id="qs">إظهار الإجابة</button>`}
     <button class="sbtn ${qShown?'go':''}" type="button" id="qn">${qIdx===QUIZ.length-1?'إنهاء ←':'التالي ←'}</button></div>`;
  const nav=d=>{if(d>0&&!qShown){qShown=true;toolQuiz();return}qIdx=Math.max(0,qIdx+d);qShown=false;toolQuiz()};
  $('#qp').onclick=()=>nav(-1);$('#qn').onclick=()=>{qShown=true;nav(1)};if($('#qs'))$('#qs').onclick=()=>{qShown=true;toolQuiz()};
  stKeys=nav;
}
